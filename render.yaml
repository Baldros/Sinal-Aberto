services:
  - type: web
    name: sinal-aberto-mcp
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m sinal_aberto.server
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: SINAL_ABERTO_HOST
        value: 0.0.0.0
      - key: FOGOCRUZADO_EMAIL
        sync: false
      - key: FOGOCRUZADO_PASSWORD
        sync: false
